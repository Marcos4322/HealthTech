import java.util.Properties

plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.fitsync'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.fitsync"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        Properties properties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            properties.load(new FileInputStream(localPropertiesFile))
        }

        // Limpiar la URL por si viene con \:// escapado
        def supabaseUrl = properties.getProperty('SUPABASE_URL', '')
                .replace('\\:', ':')
                .trim()

        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${properties.getProperty('SUPABASE_ANON_KEY', '').trim()}\""
        // Usa la ANON_KEY como fallback si no tienes PUBLISHABLE_KEY todavía
        def publishableKey = properties.getProperty('SUPABASE_PUBLISHABLE_KEY', '').trim()
        if (publishableKey.isEmpty()) {
            publishableKey = properties.getProperty('SUPABASE_ANON_KEY', '').trim()
        }
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", "\"${publishableKey}\""
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    def nav_version = "2.7.7"
    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}